name: Test

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Explicit prefix (not ${{ github.workflow }}) so this reusable workflow does not
  # share a concurrency group with the caller (ci.yml) — caller/callee on the same
  # group with cancel-in-progress: true triggers GitHub's deadlock detection.
  group: Test-${{ github.event.pull_request.number || github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # No step in this job pushes; the credential is not needed.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default; a cache
          # restored from a PR run must not reach a publishing job.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify Jest is installed
        run: npx jest --version

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration || echo "No integration tests found"
