name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  # Same group for same release whether triggered by push (tag) or workflow_dispatch (inputs.tag)
  group: ${{ github.workflow || 'Release' }}-${{ github.event.inputs.tag || github.ref_name || github.ref || github.run_id }}
  cancel-in-progress: false

# Floor for every job in this file. Deleting this block would NOT narrow anything -- jobs
# would fall back to the repository default, which may be write-all. packages: write used
# to sit here; it now sits on the e2e job that actually pushes a test image.
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    # `$/` is GitHub syntax from July 2026 and act 0.2.89 rejects it outright ("must start
    # with './' if it's a local workflow"), which would break every `npm run test:act:*`
    # script here. The marker must sit ON the uses: line -- a comment above a JOB-level
    # uses: is not honoured, unlike the step-level case.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]
    # No `secrets:` block: ci.yml reads no secret other than the automatic
    # GITHUB_TOKEN, which is always available and cannot be passed explicitly.

  e2e-tests:
    needs: ci
    permissions:
      contents: read
      packages: write   # the e2e-real job pushes a throwaway test image to ghcr.io
    # See the note on the ci job above; act rejects `$/`.
    uses: ./.github/workflows/e2e-tests.yml  # zizmor: ignore[self-repository]
    # Exactly the secrets e2e-tests.yml declares, instead of inheriting every secret
    # in the repository. GITHUB_TOKEN is deliberately absent: it is automatic and
    # GitHub rejects passing it by name.
    secrets:
      E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      E2E_GITEA_TOKEN: ${{ secrets.E2E_GITEA_TOKEN }}
      E2E_DOCKERHUB_TOKEN: ${{ secrets.E2E_DOCKERHUB_TOKEN }}

  release:
    needs: [ci, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # creates the release and moves the floating tags
      pull-requests: read
    steps:
      - name: Checkout code
        # zizmor: ignore[artipacked] — the floating-tags step later in this job
        # force-pushes vX/vX.Y using these persisted credentials; disabling them
        # breaks the release, and only at release time.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Parse and validate version tag
        id: version
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-tag-validate-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          version-type: 'auto'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          # setup-node enables package-manager caching by default; a cache
          # restored from a PR run must not reach a publishing job.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and package action
        run: npm run package

      - name: Verify packaged output is committed
        run: |
          # Only require the runtime bundle (index.js, index.js.map) to match; .d.ts.map can differ (paths)
          if ! git diff --quiet dist/index.js dist/index.js.map 2>/dev/null; then
            echo "::error::dist/index.js or dist/index.js.map changed after packaging. Run 'npm run package' and commit dist/."
            git diff --stat dist/index.js dist/index.js.map
            exit 1
          fi
          echo "Runtime bundle (dist/index.js, dist/index.js.map) is committed."

      - name: Generate release notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@cb021f9b36a51a7c6f18e4679b6fa2cb77a1260c # v6
        with:
          mode: "HYBRID"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Pull Requests</summary>\n\n#{{PR_LIST}}\n</details>\n\n---\n\n### Usage\n\n```yaml\n- uses: LiquidLogicLabs/git-action-docker-cleanup@${{ github.ref_name }}\n  with:\n    registry-type: 'ghcr'\n    package: 'my-package'\n    dry-run: true\n```"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update Major and Minor Version Tags
        if: steps.version.outputs.has-prerelease != 'true' && steps.version.outputs.is-valid == 'true'
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-tag-floating-version@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          # Without this the minor tag (vX.Y) is never moved: the action defaults it to
          # false, so every repo left vX.Y frozen at an old release while the summary
          # below claimed it had been created.
          update-minor: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        # zizmor: ignore[unpinned-uses] — first-party action; no Renovate or
        # Dependabot exists in these repos, so a SHA pin would freeze it and stop
        # security fixes reaching us through @v2.
        uses: LiquidLogicLabs/git-action-release@v2
        with:
          tag: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.version.outputs.has-prerelease == 'true' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        env:
          Z_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          Z_REPOSITORY: ${{ github.repository }}
          Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
          Z_VERSION_OUTPUTS_HAS_PRERELEASE: ${{ steps.version.outputs.has-prerelease }}
          Z_VERSION_OUTPUTS_MAJOR: ${{ steps.version.outputs.major }}
          Z_VERSION_OUTPUTS_MINOR: ${{ steps.version.outputs.minor }}
          Z_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "## 🎉 Release Complete!"
            echo ""
            echo "- **Version**: ${Z_VERSION_OUTPUTS_VERSION}"
            echo "- **GitHub Release**: [View Release](https://github.com/${Z_REPOSITORY}/releases/tag/${Z_EVENT_INPUTS_TAG_GITHUB_REF_NAME})"
            if [ "${Z_VERSION_OUTPUTS_HAS_PRERELEASE}" == "true" ]; then
              echo "- **Status**: ⚠️ Pre-release (for testing)"
            else
              echo "- **Status**: ✅ Stable release"
              echo "- **Version Tags Created**: \`@v${Z_VERSION_OUTPUTS_MAJOR}\`, \`@v${Z_VERSION_OUTPUTS_MAJOR}.${Z_VERSION_OUTPUTS_MINOR}\`, \`@${Z_REF_NAME}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  verify-release:
    # A tag push is what TRIGGERS this workflow, so the tag necessarily exists before the
    # release can even be attempted. Every failure in between therefore leaves a public
    # orphan tag behind, and nothing else in CI looks for one. 34 accumulated across these
    # repos before this job existed, from two observed modes: the release job failing
    # outright (tag-info v2.0.7, run 33896069051), and the release job being SKIPPED
    # because e2e failed (tag-create-update v2.0.5, run 33798903081). Both runs were red
    # at the time and the tag still survived, so reporting alone does not fix this.
    # This job makes a release atomic: either the tag and its release both exist, or
    # neither does.
    #
    # Scoped to `push` deliberately. On a push the tag was created by this very run, so
    # rolling it back only undoes this run's own side effect. On workflow_dispatch the tag
    # pre-existed and is not this run's to delete.
    #
    # Deleting a tag raises a `delete` event, not `push`, so this cannot re-trigger the
    # workflow.
    needs: [release]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # deletes the orphan tag
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] — the rollback step below deletes the orphan tag
        # over the remote using these persisted credentials.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Tag must have a release, or be rolled back
        env:
          Z_TAG: ${{ github.ref_name }}
          Z_REPO: ${{ github.repository }}
          Z_SERVER_URL: ${{ github.server_url }}
          Z_API_URL: ${{ github.api_url }}
          Z_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          # GitHub serves its API from api.github.com; Gitea serves it from <origin>/api/v1.
          # Both implement GET /repos/{owner}/{repo}/releases/tags/{tag}.
          if [ "${Z_SERVER_URL}" = "https://github.com" ]; then
            api="${Z_API_URL}"
          else
            api="${Z_SERVER_URL}/api/v1"
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${Z_TOKEN}" \
            -H "Accept: application/json" \
            "${api}/repos/${Z_REPO}/releases/tags/${Z_TAG}" || echo "000")

          if [ "${code}" = "200" ]; then
            echo "Release exists for ${Z_TAG}."
            exit 0
          fi

          # Only a definitive 404 proves the release is absent. On any other outcome the
          # state is unknown, and deleting a tag on a guess is worse than leaving it.
          if [ "${code}" != "404" ]; then
            echo "::error::Could not determine whether ${Z_TAG} has a release (HTTP ${code}). Leaving the tag in place."
            exit 1
          fi

          echo "::error::${Z_TAG} was pushed but no release was created. Rolling the tag back."
          git push origin ":refs/tags/${Z_TAG}"
          echo "Deleted ${Z_TAG}. Fix the failure above, then re-tag the existing commit:"
          echo "  git tag ${Z_TAG} <commit> && git push origin ${Z_TAG}"
          exit 1
